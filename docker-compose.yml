services:
  db:
    image: postgres:17
    container_name: pgstore-db
    environment:
      POSTGRES_USER: pgstore
      POSTGRES_PASSWORD: pgstore-dev
      POSTGRES_DB: pgstore
      # Toasts bytea out-of-line automatically; no tuning needed for testing,
      # but these make bulk loads more predictable:
      PGTZ: Europe/London
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "max_wal_size=2GB"
      # Force TOAST compression on; objects are stored as bytea blobs
      - "-c"
      - "wal_compression=on"
    ports:
      - "5432:5432"
    volumes:
      - pgstore_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgstore -d pgstore"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: pgstore-api
    environment:
      DATABASE_URL: postgresql://pgstore:pgstore-dev@db:5432/pgstore
      HOST: 0.0.0.0
      PORT: 8000
      # MAX_UPLOAD_BYTES: 52428800   # default 50 MiB; whole body is buffered before the INSERT
      # CORS_ORIGINS: ""             # only needed if a separate frontend calls the API
    ports:
      # No authentication yet: publish on localhost only.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgstore_data:
