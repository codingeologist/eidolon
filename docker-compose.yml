services:
  db:
    image: postgres:17
    container_name: pgstore-db
    environment:
      POSTGRES_USER: pgstore
      POSTGRES_PASSWORD: pgstore-dev
      POSTGRES_DB: pgstore
      # Toasts bytea out-of-line automatically; no tuning needed for testing,
      # but these make bulk loads more predictable:
      PGTZ: Europe/London
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "max_wal_size=2GB"
      # Force TOAST compression on; objects are stored as bytea blobs
      - "-c"
      - "wal_compression=on"
    ports:
      - "5432:5432"
    volumes:
      - pgstore_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgstore -d pgstore"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: postgrest/postgrest:latest
    container_name: pgstore-api
    environment:
      PGRST_DB_URI: postgres://pgstore:pgstore-dev@db:5432/pgstore
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: pgstore
      PGRST_SERVER_PORT: 3000
      # CORS: leave PGRST_SERVER_CORS_ALLOWED_ORIGINS unset to allow all origins.
      # Setting it to "*" is treated as a literal origin in 16.x and blocks everything.
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    labels:
      note: "after DDL run: curl -X POST http://localhost:3000/reload"

volumes:
  pgstore_data:
