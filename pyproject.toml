[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]

name = "Eidolon"
version = "0.1.0"
dependencies = [
    "psycopg[binary]",
    "pillow",
    "textual",
    "textual-image"
]

requires-python = ">3.12"
authors = [
    { name = "codingeologist", email = "coding.geologist@gmail.com" }
]
maintainers = [
    { name = "codingeologist", email = "coding.geologist@gmail.com" }
]
description = "From image to archive"
readme = "README.md"

[project.optional-dependencies]
# FastAPI service (pinned to the versions it was tested against)
api = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "psycopg-pool==3.3.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
eidolon = "Eidolon.tui:tuiapp"
eidolon-api = "Eidolon.api.main:run"
