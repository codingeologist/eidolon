[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]

name = "Eidolon"
version = "0.1.0"
dependencies = [
    "psycopg[binary]",
    "pillow",
    "textual",
    "textual-image"
]

requires-python = ">3.12"
authors = [
    { name = "codingeologist", email = "coding.geologist@gmail.com" }
]
maintainers = [
    { name = "codingeologist", email = "coding.geologist@gmail.com" }
]
description = "From image to archive"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
eidolon = "Eidolon.tui:tuiapp"
